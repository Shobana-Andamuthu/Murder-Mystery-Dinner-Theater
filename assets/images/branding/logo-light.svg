<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 62" fill="none" width="360" height="62">
  <defs>
    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="crestLightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Ornate Luxury Shield Crest (Light Theme) -->
  <g transform="translate(4, 4)">
    <!-- Outer Shield -->
    <path d="M24 2 L44 12 L44 33 C44 43 24 51 24 51 C24 51 4 43 4 33 L4 12 Z" 
          fill="url(#crestLightBg)" stroke="url(#goldGradLight)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Inner Inset Shield -->
    <path d="M24 7 L39 15 L39 31 C39 39 24 45.5 24 45.5 C24 45.5 9 39 9 31 L9 15 Z" 
          fill="none" stroke="url(#goldGradLight)" stroke-width="1.1" opacity="0.85" stroke-linejoin="round"/>
    
    <!-- Theater Mask / Keyhole Mystery Emblem -->
    <path d="M15 22 C17.5 19 21 20 24 22.5 C27 20 30.5 19 33 22 C34.5 24 33.5 27 24 32 C14.5 27 13.5 24 15 22 Z" 
          fill="url(#goldGradLight)"/>
    <ellipse cx="19.5" cy="23.5" rx="2" ry="1.4" fill="#FFFFFF"/>
    <ellipse cx="28.5" cy="23.5" rx="2" ry="1.4" fill="#FFFFFF"/>
    <!-- Antique Keyhole Stem -->
    <path d="M24 28 C22.6 28 21.5 29.1 21.5 30.5 C21.5 31.4 22 32.2 22.8 32.6 L22 38.5 H26 L25.2 32.6 C26 32.2 26.5 31.4 26.5 30.5 C26.5 29.1 25.4 28 24 28 Z" 
          fill="url(#goldGradLight)"/>
    
    <!-- Top Crest Crown Star -->
    <path d="M24 0 L25.3 3.8 L29 4.8 L25.3 5.8 L24 9.6 L22.7 5.8 L19 4.8 L22.7 3.8 Z" fill="#D97706"/>
  </g>

  <!-- Typography: High Contrast Deep Amber Bronze -->
  <text x="62" y="28.5" 
        font-family="'Cinzel', 'Cinzel Decorative', 'Playfair Display', 'Georgia', serif" 
        font-size="20.5" 
        font-weight="800" 
        letter-spacing="2.2" 
        fill="url(#goldGradLight)">THE GRAND ENIGMA</text>
        
  <text x="63.5" y="45.5" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" 
        font-size="9" 
        font-weight="700" 
        letter-spacing="3.2" 
        fill="#92400E" 
        opacity="0.95">MURDER MYSTERY DINNER THEATER</text>
</svg>
